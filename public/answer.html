<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>答案之书 · 好灵</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet" />
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #E8E4DE;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Noto Serif SC', serif;
}

/* ── 手机容器 ── */
#phone {
  position: relative;
  width: 320px;
  height: 660px;
  border-radius: 36px;
  background: #F2EFE9;
  border: 0.5px solid rgba(0,0,0,0.08);
  overflow: hidden;
  font-family: 'Noto Serif SC', serif;
  user-select: none;
}

/* ── 状态栏 ── */
#statusbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 44px;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  pointer-events: none;
}

#statusbar .time {
  font-size: 12px;
  font-weight: 400;
  color: #1C1C1C;
  letter-spacing: 0.02em;
}

#statusbar .icons {
  display: flex;
  align-items: center;
  gap: 5px;
  color: #1C1C1C;
}

#statusbar .icons svg {
  display: block;
}

/* ── 光晕公共 ── */
.glow {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

/* ── 页面公共 ── */
.page {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.page.active {
  opacity: 1;
  pointer-events: all;
}

/* ── 小标签 ── */
.book-label {
  font-size: 11px;
  color: #888;
  letter-spacing: 0.15em;
  text-align: center;
  font-weight: 300;
}

/* ===========================
   页面0：书封页
   =========================== */
#page0 {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

#page0 .glow-black {
  width: 280px;
  height: 280px;
  background: #1C1C1C;
  filter: blur(70px);
  opacity: 0.12;
  top: -40px;
  left: -60px;
}

#page0 .glow-gold {
  width: 220px;
  height: 220px;
  background: #C4A882;
  filter: blur(60px);
  opacity: 0.18;
  bottom: 60px;
  right: -40px;
}

#page0 .label-wrap {
  margin-bottom: 28px;
}

#page0 .book-cover {
  width: 130px;
  height: 175px;
  position: relative;
  cursor: pointer;
  transition: transform 0.3s ease;
}

#page0 .book-cover:hover {
  transform: scale(1.02);
}

#page0 .book-cover:active {
  transform: scale(0.98);
}

.book-cover-inner {
  position: absolute;
  inset: 0;
  background: #1C1C1C;
  border-radius: 3px 8px 8px 3px;
}

.book-spine {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 12px;
  background: #0a0a0a;
  border-radius: 3px 0 0 3px;
}

.book-svg-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#page0 .hint-text {
  margin-top: 20px;
  font-size: 11px;
  color: #AAAAAA;
  letter-spacing: 0.06em;
  text-align: center;
  font-weight: 300;
}

#page0 .tagline {
  margin-top: 20px;
  font-size: 14px;
  color: #555;
  line-height: 1.9;
  text-align: center;
  font-weight: 300;
}

#page0 .tagline .tagline-highlight {
  color: #C4A882;
  letter-spacing: 0.02em;
}

/* ===========================
   页面1：数字输入页
   =========================== */
#page1 {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 80px 32px 40px;
}

#page1 .label-wrap {
  margin-bottom: 40px;
  align-self: center;
}

#page1 .guide-text {
  font-size: 18px;
  font-weight: 300;
  line-height: 1.9;
  color: #1C1C1C;
  text-align: center;
  margin-bottom: 48px;
}

.num-input-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

#numInput {
  width: 100px;
  border: none;
  border-bottom: 0.5px solid #BBBBBB;
  background: transparent;
  font-size: 52px;
  font-weight: 300;
  color: #1C1C1C;
  text-align: center;
  font-family: 'Noto Serif SC', serif;
  outline: none;
  transition: border-color 0.3s, color 0.3s;
  padding-bottom: 4px;
  -moz-appearance: textfield;
}

#numInput::-webkit-outer-spin-button,
#numInput::-webkit-inner-spin-button {
  -webkit-appearance: none;
}

#numInput:focus {
  border-bottom-color: #1C1C1C;
}

#numInput::placeholder {
  font-size: 28px;
  color: #CCCCCC;
  font-weight: 300;
}

#numInput.fate-anim {
  color: #AAAAAA;
}

.num-range {
  font-size: 11px;
  color: #AAAAAA;
  letter-spacing: 0.04em;
  font-weight: 300;
}

#fateLink {
  margin-top: 12px;
  font-size: 11px;
  color: #AAAAAA;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  background: none;
  border: none;
  font-family: 'Noto Serif SC', serif;
  font-weight: 300;
}

#page1 .btn-main {
  margin-top: 40px;
  width: 100%;
  max-width: 220px;
  background: #1C1C1C;
  color: #FFFFFF;
  border: none;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.08em;
  padding: 15px;
  cursor: pointer;
  font-family: 'Noto Serif SC', serif;
  opacity: 0.2;
  pointer-events: none;
  transition: opacity 0.3s;
}

#page1 .btn-main.enabled {
  opacity: 1;
  pointer-events: all;
}

/* ===========================
   页面2：翻书动画页
   =========================== */
#page2 {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#page2 .glow-center {
  width: 300px;
  height: 300px;
  background: #1C1C1C;
  filter: blur(80px);
  opacity: 0.08;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

#page2BookWrap {
  position: relative;
  width: 170px;
  height: 220px;
  perspective: 800px;
}

.book-cover-p2 {
  position: absolute;
  inset: 0;
  background: #1C1C1C;
  border-radius: 3px 8px 8px 3px;
  z-index: 1;
}

.book-spine-p2 {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 12px;
  background: #0a0a0a;
  border-radius: 3px 0 0 3px;
  z-index: 2;
}

.book-page {
  position: absolute;
  right: 0;
  top: 0;
  width: 158px;
  height: 220px;
  border-radius: 0 6px 6px 0;
  transform-origin: left center;
  backface-visibility: hidden;
  transform-style: preserve-3d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  overflow: hidden;
}

.page-line {
  width: 50%;
  height: 0.5px;
  background: rgba(0,0,0,0.08);
}

.page-char {
  font-size: 11px;
  color: rgba(0,0,0,0.12);
  letter-spacing: 4px;
  font-weight: 300;
  font-family: 'Noto Serif SC', serif;
}

#page2StatusText {
  margin-top: 32px;
  font-size: 12px;
  color: #888;
  letter-spacing: 0.06em;
  font-weight: 300;
  text-align: center;
}

#page2StatusText span {
  color: #1C1C1C;
}

/* ===========================
   页面3：答案页
   =========================== */
#page3 {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 80px 32px 56px;
}

#page3 .glow-black {
  width: 260px;
  height: 260px;
  background: #1C1C1C;
  filter: blur(75px);
  opacity: 0.09;
  top: -30px;
  right: -60px;
}

#page3 .glow-gold {
  width: 180px;
  height: 180px;
  background: #C4A882;
  filter: blur(55px);
  opacity: 0.15;
  bottom: 80px;
  left: -30px;
}

#page3 .label-wrap {
  margin-bottom: 60px;
}

.answer-card {
  background: #FFFFFF;
  border-radius: 16px;
  border: 0.5px solid rgba(0,0,0,0.06);
  padding: 32px 24px;
  position: relative;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.answer-card.visible {
  opacity: 1;
  transform: translateY(0);
}

.answer-card-inner {
  position: absolute;
  inset: 10px;
  border: 0.5px solid rgba(0,0,0,0.05);
  border-radius: 8px;
  pointer-events: none;
}

.answer-date {
  font-size: 9px;
  color: #BBBBBB;
  letter-spacing: 0.1em;
  text-align: center;
  margin-bottom: 24px;
  font-weight: 300;
}

.answer-main {
  font-size: 22px;
  font-weight: 300;
  color: #1C1C1C;
  line-height: 1.7;
  letter-spacing: 0.04em;
  text-align: center;
  white-space: pre-line;
}

.answer-divider {
  width: 32px;
  height: 0.5px;
  background: #DDDDDD;
  margin: 16px auto;
}

.answer-sub {
  font-size: 12px;
  color: #888;
  line-height: 1.9;
  text-align: center;
  white-space: pre-line;
  font-weight: 300;
}

.page3-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.page3-bottom.visible {
  opacity: 1;
}

/* 双击提示区域 */
.hint-double-tap-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-bottom: 20px;
}

.hint-double-tap-icon {
  font-size: 13px;
  color: #CCCCCC;
  animation: floatHint 3s ease-in-out infinite;
}

@keyframes floatHint {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(-3px); opacity: 1; }
}

.hint-double-tap {
  font-size: 11px;
  color: #CCCCCC;
  letter-spacing: 0.06em;
  text-align: center;
  font-weight: 300;
}

/* 分享到抖音区域 */
.share-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

/* 分享说明文字 */
.share-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: #BBBBBB;
  letter-spacing: 0.08em;
  font-weight: 300;
}

.share-eyebrow::before,
.share-eyebrow::after {
  content: '';
  display: block;
  width: 20px;
  height: 0.5px;
  background: #DDDDDD;
}

/* 转发圆形按钮 */
.btn-douyin {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 58px;
  height: 58px;
  background: #F5F3EE;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  box-shadow:
    0 2px 8px rgba(0,0,0,0.18),
    0 0 0 1.5px rgba(180,170,155,0.55),
    inset 0 1px 2px rgba(255,255,255,0.85);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  overflow: visible;
}

.btn-douyin:active {
  transform: scale(0.93);
  box-shadow:
    0 1px 4px rgba(0,0,0,0.15),
    0 0 0 1.5px rgba(180,170,155,0.55),
    inset 0 1px 2px rgba(255,255,255,0.85);
}

.btn-douyin:hover {
  box-shadow:
    0 4px 14px rgba(0,0,0,0.22),
    0 0 0 1.5px rgba(180,170,155,0.55),
    inset 0 1px 2px rgba(255,255,255,0.85);
}

/* 隐藏抖音logo */
.douyin-logo {
  display: none;
}

/* 隐藏文字 */
.btn-douyin span {
  display: none;
}

/* 移除扫光 */
.btn-douyin::after {
  display: none;
}


/* ===========================
   双击涟漪
   =========================== */
.ripple {
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(28,28,28,0.06);
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0);
  animation: ripple-anim 0.8s ease-out forwards;
  z-index: 60;
}

@keyframes ripple-anim {
  to {
    transform: translate(-50%, -50%) scale(8);
    opacity: 0;
  }
}

/* ===========================
   冷启动蒙层
   =========================== */
#onboardOverlay {
  position: absolute;
  inset: 0;
  z-index: 80;
  background: rgba(242,239,233,0.96);
  border-radius: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

#onboardOverlay.visible {
  opacity: 1;
  pointer-events: all;
}

.onboard-icon {
  font-size: 28px;
  color: #1C1C1C;
  animation: pulse 2.5s ease-in-out infinite;
  margin-bottom: 24px;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.1); opacity: 1; }
}

.onboard-title {
  font-size: 17px;
  font-weight: 300;
  color: #1C1C1C;
  line-height: 1.8;
  letter-spacing: 0.04em;
  text-align: center;
  margin-bottom: 16px;
}

.onboard-sub {
  font-size: 12px;
  color: #AAAAAA;
  line-height: 1.9;
  text-align: center;
  font-weight: 300;
}

.onboard-btn {
  margin-top: 40px;
  background: #F2EFE9;
  color: #1C1C1C;
  border: 0.5px solid rgba(0,0,0,0.12);
  border-radius: 50px;
  font-size: 12px;
  font-weight: 300;
  padding: 12px 32px;
  cursor: pointer;
  font-family: 'Noto Serif SC', serif;
  letter-spacing: 0.04em;
  transition: background 0.2s;
}

.onboard-btn:hover {
  background: #EAE7E1;
}

/* ===========================
   粒子 Canvas
   =========================== */
#particleCanvas {
  position: absolute;
  inset: 0;
  z-index: 70;
  pointer-events: none;
  border-radius: 36px;
}
</style>
</head>
<body>

<div id="phone">
  <!-- 状态栏 -->
  <div id="statusbar">
    <div class="time" id="statusTime">22:47</div>
    <div class="icons">
      <!-- WiFi -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <path d="M8 9.5a1.2 1.2 0 1 1 0 2.4A1.2 1.2 0 0 1 8 9.5z" fill="#1C1C1C"/>
        <path d="M4.9 7.1a4.4 4.4 0 0 1 6.2 0" stroke="#1C1C1C" stroke-width="1.1" stroke-linecap="round" fill="none"/>
        <path d="M2.2 4.4a7.5 7.5 0 0 1 11.6 0" stroke="#1C1C1C" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      </svg>
      <!-- 电池 -->
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none">
        <rect x="0.5" y="1.5" width="18" height="9" rx="2.5" stroke="#1C1C1C" stroke-width="1"/>
        <path d="M19.5 4.5v3a1.5 1.5 0 0 0 0-3z" fill="#1C1C1C"/>
        <rect x="2" y="3" width="13" height="6" rx="1.5" fill="#1C1C1C"/>
      </svg>
    </div>
  </div>

  <!-- ===== 页面0：书封页 ===== -->
  <div id="page0" class="page active">
    <div class="glow glow-black"></div>
    <div class="glow glow-gold"></div>

    <div class="label-wrap">
      <div class="book-label">答 案 之 书</div>
    </div>

    <div id="bookCover0" class="book-cover">
      <div class="book-cover-inner"></div>
      <div class="book-spine"></div>
      <div class="book-svg-wrap">
        <svg viewBox="0 0 110 170" width="110" height="170" xmlns="http://www.w3.org/2000/svg">
          <!-- 外层金色边框 -->
          <rect x="8" y="8" width="94" height="154" rx="2" fill="none" stroke="rgba(196,168,130,0.55)" stroke-width="0.8"/>
          <!-- 内层金色边框 -->
          <rect x="13" y="13" width="84" height="144" rx="1" fill="none" stroke="rgba(196,168,130,0.25)" stroke-width="0.5"/>

          <!-- 左上角土星 -->
          <g transform="translate(26, 32)">
            <ellipse cx="0" cy="0" rx="7" ry="7" fill="rgba(196,168,130,0.18)" stroke="rgba(196,168,130,0.5)" stroke-width="0.6"/>
            <ellipse cx="0" cy="0" rx="11" ry="4" fill="none" stroke="rgba(196,168,130,0.45)" stroke-width="0.5" transform="rotate(-20)"/>
            <circle cx="0" cy="0" r="2.5" fill="rgba(196,168,130,0.6)"/>
          </g>

          <!-- 散落星星 -->
          <text x="72" y="28" font-size="6" fill="rgba(196,168,130,0.7)" text-anchor="middle">✦</text>
          <text x="88" y="48" font-size="4" fill="rgba(196,168,130,0.45)" text-anchor="middle">✧</text>
          <text x="20" y="58" font-size="5" fill="rgba(196,168,130,0.5)" text-anchor="middle">✧</text>
          <text x="92" y="80" font-size="4" fill="rgba(196,168,130,0.35)" text-anchor="middle">★</text>
          <text x="18" y="100" font-size="4" fill="rgba(196,168,130,0.4)" text-anchor="middle">✦</text>
          <text x="85" y="130" font-size="5" fill="rgba(196,168,130,0.5)" text-anchor="middle">✧</text>
          <text x="25" y="148" font-size="6" fill="rgba(196,168,130,0.55)" text-anchor="middle">★</text>
          <text x="90" y="152" font-size="4" fill="rgba(196,168,130,0.4)" text-anchor="middle">✦</text>
          <text x="55" y="22" font-size="4" fill="rgba(196,168,130,0.3)" text-anchor="middle">✧</text>

          <!-- 流星线1 -->
          <line x1="70" y1="40" x2="90" y2="58" stroke="rgba(196,168,130,0.35)" stroke-width="0.5"/>
          <circle cx="70" cy="40" r="1" fill="rgba(196,168,130,0.6)"/>
          <!-- 流星线2 -->
          <line x1="30" y1="110" x2="50" y2="128" stroke="rgba(196,168,130,0.28)" stroke-width="0.5"/>
          <circle cx="30" cy="110" r="0.8" fill="rgba(196,168,130,0.5)"/>

          <!-- 中央太阳月亮 -->
          <g transform="translate(55, 90)">
            <!-- 放射线 8条 -->
            <line x1="0" y1="-22" x2="0" y2="-16" stroke="rgba(196,168,130,0.4)" stroke-width="0.6"/>
            <line x1="0" y1="16" x2="0" y2="22" stroke="rgba(196,168,130,0.4)" stroke-width="0.6"/>
            <line x1="-22" y1="0" x2="-16" y2="0" stroke="rgba(196,168,130,0.4)" stroke-width="0.6"/>
            <line x1="16" y1="0" x2="22" y2="0" stroke="rgba(196,168,130,0.4)" stroke-width="0.6"/>
            <line x1="-15.5" y1="-15.5" x2="-11" y2="-11" stroke="rgba(196,168,130,0.3)" stroke-width="0.5"/>
            <line x1="11" y1="11" x2="15.5" y2="15.5" stroke="rgba(196,168,130,0.3)" stroke-width="0.5"/>
            <line x1="15.5" y1="-15.5" x2="11" y2="-11" stroke="rgba(196,168,130,0.3)" stroke-width="0.5"/>
            <line x1="-11" y1="11" x2="-15.5" y2="15.5" stroke="rgba(196,168,130,0.3)" stroke-width="0.5"/>
            <!-- 圆形背景 -->
            <circle cx="0" cy="0" r="12" fill="rgba(196,168,130,0.12)" stroke="rgba(196,168,130,0.45)" stroke-width="0.6"/>
            <!-- 月牙 -->
            <path d="M-3,-8 A8,8 0 0,1 -3,8 A5,5 0 0,0 -3,-8z" fill="rgba(196,168,130,0.55)"/>
            <!-- 太阳光点 -->
            <circle cx="3" cy="-2" r="2" fill="rgba(196,168,130,0.35)"/>
          </g>

          <!-- 底部点状装饰 -->
          <text x="55" y="162" font-size="5" fill="rgba(196,168,130,0.4)" text-anchor="middle" letter-spacing="3">· · · · · · · ·</text>
        </svg>
      </div>
    </div>

    <div class="hint-text">点击书本，开始翻阅</div>
    <div class="tagline">心里默念你的<span class="tagline-highlight">问题</span></div>
  </div>

  <!-- ===== 页面1：数字输入页 ===== -->
  <div id="page1" class="page">
    <div class="label-wrap">
      <div class="book-label">答 案 之 书</div>
    </div>

    <div class="guide-text">把问题放在心里<br/>心里浮现的第一个数字是</div>

    <div class="num-input-wrap">
      <input type="number" id="numInput" min="1" max="389" placeholder="?" autocomplete="off" />
      <div class="num-range">1 — 389</div>
      <button id="fateLink">不想选？让命运替你翻</button>
    </div>

    <button id="btnFlip" class="btn-main">翻 开 这 一 页</button>
  </div>

  <!-- ===== 页面2：翻书动画页 ===== -->
  <div id="page2" class="page">
    <div class="glow glow-center"></div>
    <div id="page2BookWrap">
      <div class="book-cover-p2"></div>
      <div class="book-spine-p2"></div>
      <!-- 书页由 JS 动态生成 -->
    </div>
    <div id="page2StatusText">正在翻到第 <span id="pageNumDisplay">—</span> 页</div>
  </div>

  <!-- ===== 页面3：答案页 ===== -->
  <div id="page3" class="page">
    <div class="glow glow-black"></div>
    <div class="glow glow-gold"></div>

    <div>
      <div class="label-wrap">
        <div class="book-label" style="font-size:10px;letter-spacing:.12em;color:#AAAAAA;">答 案 之 书</div>
      </div>

      <div id="answerCard" class="answer-card">
        <div class="answer-card-inner"></div>
        <div id="answerDate" class="answer-date"></div>
        <div id="answerMain" class="answer-main"></div>
        <div class="answer-divider"></div>
        <div id="answerSub" class="answer-sub"></div>
      </div>
    </div>

    <div class="page3-bottom" id="page3Bottom">
      <!-- 双击提示 -->
      <div class="hint-double-tap-wrap">
        <div class="hint-double-tap-icon">✦</div>
        <div class="hint-double-tap">双击屏幕，显化意愿</div>
      </div>

      <!-- 分享区域 -->
      <div class="share-section">
        <div class="share-eyebrow">分享你的答案</div>
        <button class="btn-douyin" id="btnShareDouyin" title="转发">
          <!-- 转发箭头图标（弯曲转发样式） -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#3B2A1A" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.7 8.3l-5.5-5.5A1 1 0 0 0 14.5 3.5v3.1C9.2 7.1 5 11.6 5 17v1a1 1 0 0 0 1.9.4C8 15.5 11 13.1 14.5 12.8v3.2a1 1 0 0 0 1.7.7l5.5-5.5a1 1 0 0 0 0-1.4z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 粒子 Canvas -->
  <canvas id="particleCanvas" width="320" height="660"></canvas>

</div>

<script>
// ─── 答案数据 ───
const answers = [
  {a:'去做吧', b:'想了很久的事情\n开始就是答案'},
];

// ─── 状态 ───
let currentState = 0;
let userNumber = null;
let lastTap = 0;
let flipTimers = [];
let particlesRunning = false;

// ─── 实时时间 ───
function updateTime() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('statusTime').textContent = h + ':' + m;
}
updateTime();
setInterval(updateTime, 30000);

// ─── 页面切换 ───
function goToPage(n) {
  document.querySelectorAll('.page').forEach((p, i) => {
    p.classList.toggle('active', i === n);
  });
  currentState = n;

  if (n === 2) {
    startFlipAnimation();
  }
  if (n === 3) {
    showAnswerPage();
  }
}

// ─── 粒子系统 ───
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

const particleColors = ['#1C1C1C', '#888888', '#C4A882', '#BBBBBB'];

function createParticles(x, y, count = 50, initVyOffset = -0.3) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 2.1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed + initVyOffset,
      alpha: 0.8 + Math.random() * 0.2,
      size: 0.5 + Math.random() * 1.5,
      color: particleColors[Math.floor(Math.random() * particleColors.length)],
    });
  }
  if (!particlesRunning) runParticles();
}

function createFlipParticles(x, y) {
  for (let i = 0; i < 8; i++) {
    const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * Math.PI;
    const speed = 0.4 + Math.random() * 1.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.2,
      alpha: 0.6 + Math.random() * 0.3,
      size: 0.5 + Math.random() * 1.2,
      color: particleColors[Math.floor(Math.random() * particleColors.length)],
    });
  }
  if (!particlesRunning) runParticles();
}

function runParticles() {
  particlesRunning = true;
  function frame() {
    ctx.clearRect(0, 0, 320, 660);
    particles = particles.filter(p => p.alpha > 0.01);
    particles.forEach(p => {
      p.vy += 0.05; // 重力
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.02;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    if (particles.length > 0) {
      requestAnimationFrame(frame);
    } else {
      particlesRunning = false;
    }
  }
  requestAnimationFrame(frame);
}

// ─── 页面0：书封点击 ───
document.getElementById('bookCover0').addEventListener('click', function(e) {
  const rect = document.getElementById('phone').getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  createParticles(x, y, 20, -0.5);
  goToPage(1);
});

// ─── 页面1：输入逻辑 ───
const numInput = document.getElementById('numInput');
const btnFlip = document.getElementById('btnFlip');

numInput.addEventListener('input', function() {
  const val = parseInt(this.value);
  if (val >= 1 && val <= 389) {
    btnFlip.classList.add('enabled');
  } else {
    btnFlip.classList.remove('enabled');
  }
});

document.getElementById('fateLink').addEventListener('click', function() {
  numInput.value = 21;
  numInput.classList.add('fate-anim');
  btnFlip.classList.add('enabled');
  setTimeout(() => {
    numInput.classList.remove('fate-anim');
  }, 600);
});

btnFlip.addEventListener('click', function() {
  const val = parseInt(numInput.value);
  if (val >= 1 && val <= 389) {
    userNumber = val;
    goToPage(2);
  }
});

// ─── 页面2：翻书动画 ───
const pageColors = ['#F5F2EC', '#F0EDE6', '#EDE9E1', '#E9E5DD', '#E5E0D7'];
const pageChars = ['宙', '命', '缘', '时', '择'];

function startFlipAnimation() {
  // 清除之前的计时器
  flipTimers.forEach(t => clearTimeout(t));
  flipTimers = [];

  const wrap = document.getElementById('page2BookWrap');
  // 移除旧书页（保留书封和书脊）
  const oldPages = wrap.querySelectorAll('.book-page');
  oldPages.forEach(p => p.remove());

  document.getElementById('pageNumDisplay').textContent = userNumber || '—';

  // 重建书页
  const pageEls = [];
  for (let i = 0; i < 5; i++) {
    const pg = document.createElement('div');
    pg.className = 'book-page';
    pg.style.background = pageColors[i];
    pg.style.zIndex = 14 - i;

    const line1 = document.createElement('div');
    line1.className = 'page-line';
    const char = document.createElement('div');
    char.className = 'page-char';
    char.textContent = pageChars[i];
    const line2 = document.createElement('div');
    line2.className = 'page-line';

    pg.appendChild(line1);
    pg.appendChild(char);
    pg.appendChild(line2);
    wrap.appendChild(pg);
    pageEls.push(pg);
  }

  // 依次翻页
  pageEls.forEach((pg, idx) => {
    const t = setTimeout(() => {
      pg.style.transition = 'transform 0.6s cubic-bezier(.4,0,.2,1)';
      pg.style.transform = 'rotateY(-175deg)';

      // 翻页粒子
      const phoneRect = document.getElementById('phone').getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const px = wrapRect.right - phoneRect.left;
      const py = wrapRect.top - phoneRect.top + wrapRect.height / 2;
      createFlipParticles(px, py);
    }, 150 + idx * 560);
    flipTimers.push(t);
  });

  // 跳转页面3
  const t3 = setTimeout(() => {
    goToPage(3);
  }, 3400);
  flipTimers.push(t3);
}

// ─── 页面3：答案展示 ───
function showAnswerPage() {
  const num = userNumber || 1;
  const ans = answers[num % answers.length];
  const now = new Date();
  const dateStr = `2026年6月21日 · 第 ${num} 页`;

  document.getElementById('answerDate').textContent = dateStr;
  document.getElementById('answerMain').textContent = ans.a;
  document.getElementById('answerSub').textContent = ans.b;

  // 卡片入场
  const card = document.getElementById('answerCard');
  card.classList.remove('visible');
  void card.offsetWidth; // 强制重排
  requestAnimationFrame(() => {
    card.classList.add('visible');
  });

  // 底部延迟出现
  const bottom = document.getElementById('page3Bottom');
  bottom.classList.remove('visible');
  setTimeout(() => {
    bottom.classList.add('visible');
  }, 500);

}

// ─── 分享到抖音 ───
document.getElementById('btnShareDouyin').addEventListener('click', function() {
  const num = userNumber || 1;
  const ans = answers[num % answers.length];
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const shareText = `【答案之书 · 第${num}页】\n${ans.a}\n\n${ans.b}\n\n${dateStr} · 我的命运签 #答案之书 #FateTell`;

  // 尝试抖音分享 / Web Share API 降级
  if (navigator.share) {
    navigator.share({
      title: '答案之书',
      text: shareText,
      url: window.location.href,
    }).catch(() => {});
  } else {
    // 在浏览器中演示：复制文字并给视觉反馈
    if (navigator.clipboard) {
      navigator.clipboard.writeText(shareText).catch(() => {});
    }
    // 视觉反馈
    const btn = document.getElementById('btnShareDouyin');
    const span = btn.querySelector('span');
    const orig = span.textContent;
    span.textContent = '已复制签文 ✓';
    btn.style.background = '#3A3A3A';
    setTimeout(() => {
      span.textContent = orig;
      btn.style.background = '#1C1C1C';
    }, 1800);
  }
});

// ─── 双击显化（页面3） ───
document.getElementById('page3').addEventListener('click', function(e) {
  const now = Date.now();
  if (now - lastTap < 320) {
    // 双击触发
    lastTap = 0;
    const phoneRect = document.getElementById('phone').getBoundingClientRect();
    const x = e.clientX - phoneRect.left;
    const y = e.clientY - phoneRect.top;

    // 涟漪
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    document.getElementById('page3').appendChild(ripple);
    setTimeout(() => ripple.remove(), 900);

    // 粒子
    createParticles(x, y, 50, -0.3);
  } else {
    lastTap = now;
  }
});

// ─── 禁止默认双击行为 ───
document.getElementById('phone').addEventListener('dblclick', function(e) {
  e.preventDefault();
});
</script>

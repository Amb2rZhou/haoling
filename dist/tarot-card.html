<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI疗愈卡片 P1 Final Demo</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --bg-soft: #efede8;
      --text: #27272c;
      --text-soft: rgba(39, 39, 44, 0.64);
      --text-faint: rgba(39, 39, 44, 0.32);
      --card: #28285d;
      --card-2: #20204f;
      --card-line: rgba(248, 243, 231, 0.78);
      --shadow: rgba(20, 20, 28, 0.16);
      --gold: rgba(191, 148, 63, 0.88);
      --gold-soft: rgba(191, 148, 63, 0.28);
      --gold-faint: rgba(191, 148, 63, 0.14);
      --font-ui: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "PMingLiU", serif;
      --font-en: "Cormorant Garamond", "Times New Roman", Georgia, serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(90deg, #fbfaf6 0%, #f1efeb 100%);
      font-family: var(--font-ui);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .phone {
      width: min(444px, 100vw);
      height: min(963px, 100vh);
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 20%, rgba(255,255,255,0.8), transparent 24%),
        radial-gradient(circle at 82% 28%, rgba(236,233,226,0.22), transparent 28%),
        linear-gradient(90deg, #fdfcf9 0%, #f3f1ec 100%);
      box-shadow: 0 26px 80px rgba(0,0,0,0.12);
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), transparent 20%),
        radial-gradient(circle at 82% 56%, rgba(255,255,255,0.02), transparent 30%);
      pointer-events: none;
      z-index: 0;
    }

    .phone::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      left: -112px;
      bottom: -120px;
      border-radius: 50%;
      border: 1px solid rgba(40, 40, 48, 0.035);
      box-shadow: 0 0 0 28px rgba(40, 40, 48, 0.016), 0 0 0 62px rgba(40, 40, 48, 0.012);
      pointer-events: none;
      z-index: 0;
    }

    .ornament-frame,
    .ornament-top,
    .ornament-bottom,
    .ornament-star,
    .ornament-star::before,
    .ornament-star::after,
    .ornament-star i,
    .ornament-star b,
    .ornament-star i::before,
    .ornament-star b::before {
      position: absolute;
      pointer-events: none;
    }

    .ornament-frame {
      inset: 16px;
      z-index: 2;
    }

    .ornament-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(191, 148, 63, 0.18);
      border-radius: 34px;
    }

    .ornament-frame::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(191, 148, 63, 0.08);
      border-radius: 28px;
    }

    .ornament-top,
    .ornament-bottom {
      left: 86px;
      right: 86px;
      height: 28px;
    }

    .ornament-top { top: -2px; }
    .ornament-bottom { bottom: -2px; }

    .ornament-top::before,
    .ornament-top::after,
    .ornament-bottom::before,
    .ornament-bottom::after {
      content: "";
      position: absolute;
      top: 13px;
      height: 1px;
      width: calc(50% - 24px);
      background: linear-gradient(90deg, rgba(191, 148, 63, 0), rgba(191, 148, 63, 0.36) 24%, rgba(191, 148, 63, 0.1) 100%);
    }

    .ornament-top::before,
    .ornament-bottom::before { left: 0; }

    .ornament-top::after,
    .ornament-bottom::after {
      right: 0;
      transform: scaleX(-1);
    }

    .ornament-star {
      left: 50%;
      top: 0;
      width: 24px;
      height: 24px;
      transform: translateX(-50%);
    }

    .ornament-star::before,
    .ornament-star::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .ornament-star::before {
      width: 1px;
      height: 24px;
      background: linear-gradient(180deg, rgba(191,148,63,0), rgba(191,148,63,0.52), rgba(191,148,63,0));
    }

    .ornament-star::after {
      width: 24px;
      height: 1px;
      background: linear-gradient(90deg, rgba(191,148,63,0), rgba(191,148,63,0.52), rgba(191,148,63,0));
    }

    .ornament-star i,
    .ornament-star b {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      transform-origin: center;
    }

    .ornament-star i::before,
    .ornament-star b::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 16px;
      background: linear-gradient(180deg, rgba(191,148,63,0), rgba(191,148,63,0.28), rgba(191,148,63,0));
      transform: translate(-50%, -50%);
    }

    .ornament-star i { transform: translate(-50%, -50%) rotate(45deg); }
    .ornament-star b { transform: translate(-50%, -50%) rotate(-45deg); }

    .center-star-mask {
      display: none;
    }

    .ornament-top,
    .ornament-bottom {
      left: 42px;
      right: 42px;
      height: 34px;
    }

    .ornament-top { top: 6px; }
    .ornament-bottom { bottom: 6px; transform: scaleY(-1); }

    .ornament-top::before,
    .ornament-top::after,
    .ornament-bottom::before,
    .ornament-bottom::after {
      content: "";
      position: absolute;
      top: 14px;
      height: 1px;
      width: calc(50% - 36px);
      background: linear-gradient(90deg, rgba(191, 148, 63, 0), rgba(191, 148, 63, 0.66) 24%, rgba(191, 148, 63, 0.18) 100%);
    }

    .ornament-top::before,
    .ornament-bottom::before { left: 0; }

    .ornament-top::after,
    .ornament-bottom::after {
      right: 0;
      transform: scaleX(-1);
    }

    .ornament-star {
      left: 50%;
      top: -1px;
      width: 36px;
      height: 36px;
      transform: translateX(-50%);
    }

    .ornament-star::before,
    .ornament-star::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .ornament-star::before {
      width: 1px;
      height: 36px;
      background: linear-gradient(180deg, rgba(191,148,63,0), rgba(191,148,63,0.86), rgba(191,148,63,0));
      box-shadow:
        0 0 0 0 rgba(0,0,0,0),
        0 0 0 0 rgba(0,0,0,0),
        0 0 0 0 rgba(0,0,0,0),
        0 0 0 0 rgba(0,0,0,0),
        0 0 6px rgba(191,148,63,0.08);
    }

    .ornament-star::after {
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, rgba(191,148,63,0), rgba(191,148,63,0.86), rgba(191,148,63,0));
      box-shadow: 0 0 6px rgba(191,148,63,0.08);
    }

    .ornament-star i,
    .ornament-star b {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      transform-origin: center;
      pointer-events: none;
    }

    .ornament-star i::before,
    .ornament-star b::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 24px;
      background: linear-gradient(180deg, rgba(191,148,63,0), rgba(191,148,63,0.5), rgba(191,148,63,0));
      transform: translate(-50%, -50%);
    }

    .ornament-star i { transform: translate(-50%, -50%) rotate(45deg); }
    .ornament-star b { transform: translate(-50%, -50%) rotate(-45deg); }

    .ornament-side {
      top: 68px;
      bottom: 68px;
      width: 26px;
      color: rgba(191, 148, 63, 0.88);
    }

    .ornament-side.left { left: 8px; }
    .ornament-side.right { right: 8px; transform: scaleX(-1); }

    .ornament-side::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 34px;
      bottom: 34px;
      width: 1px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(191,148,63,0) 0%, rgba(191,148,63,0.42) 7%, rgba(191,148,63,0.42) 93%, rgba(191,148,63,0) 100%);
    }

    .ornament-side::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 18%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      transform: translateX(-50%);
      box-shadow:
        0 116px 0 0 var(--gold),
        0 232px 0 0 var(--gold),
        0 348px 0 0 var(--gold),
        0 464px 0 0 var(--gold);
      opacity: 0.8;
    }

    .ornament-side i,
    .ornament-side b {
      position: absolute;
      left: 50%;
      width: 26px;
      height: 44px;
      transform: translateX(-50%);
      display: block;
      filter: drop-shadow(0 0 2px rgba(191,148,63,0.08));
    }

    .ornament-side i { top: -10px; }
    .ornament-side b { bottom: -10px; transform: translateX(-50%) scaleY(-1); }

    .ornament-side i::before,
    .ornament-side i::after,
    .ornament-side b::before,
    .ornament-side b::after {
      content: "";
      position: absolute;
      border: 1.5px solid currentColor;
      border-color: currentColor transparent transparent transparent;
      border-radius: 50%;
    }

    .ornament-side i::before,
    .ornament-side b::before {
      width: 24px;
      height: 24px;
      left: -2px;
      top: 2px;
      transform: rotate(12deg);
    }

    .ornament-side i::after,
    .ornament-side b::after {
      width: 14px;
      height: 14px;
      left: 10px;
      top: 14px;
      transform: rotate(30deg);
      opacity: 0.78;
    }

    .brand-mark {
      position: absolute;
      right: 40px;
      bottom: 40px;
      z-index: 4;
      width: 54px;
      height: 54px;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0.72;
      mix-blend-mode: multiply;
      filter: grayscale(1) contrast(1.18) brightness(0.38) sepia(1) hue-rotate(175deg) saturate(4.2);
    }

    .status,
    .brand { display: none; }

    .top-copy {
      position: absolute;
      left: 32px;
      right: 32px;
      top: 72px;
      z-index: 5;
      transition: opacity 500ms ease, transform 500ms ease, filter 500ms ease;
    }

    .top-copy.faded {
      opacity: 0.28;
      filter: blur(1.6px);
      transform: scale(0.98);
    }

    .title,
    .subtitle,
    .guide,
    .result-sheet {
      opacity: 0;
      transform: translateY(18px);
      animation: floatIn 720ms cubic-bezier(.2,.86,.22,1) forwards;
    }

    .title {
      font-size: 31px;
      line-height: 1.28;
      font-weight: 400;
      letter-spacing: 0;
      color: rgba(41, 41, 48, 0.96);
      font-family: var(--font-ui);
      animation-delay: 120ms;
    }

    .subtitle {
      margin-top: 18px;
      font-size: 17px;
      line-height: 1.88;
      font-weight: 400;
      letter-spacing: 0;
      color: rgba(84, 84, 92, 0.78);
      font-family: var(--font-ui);
      width: 11.4em;
      animation-delay: 760ms;
    }

    .subtitle .line { display: block; }

    .guide {
      position: absolute;
      left: 34px;
      top: 306px;
      z-index: 5;
      animation-delay: 1420ms;
      transition: opacity 360ms ease, transform 360ms ease;
    }

    .guide.hidden {
      opacity: 0 !important;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .guide .small {
      font-size: 15px;
      line-height: 1.56;
      font-weight: 400;
      letter-spacing: 0;
      color: rgba(122, 122, 130, 0.78);
      font-family: var(--font-ui);
    }

    .guide .action {
      position: relative;
      display: inline-block;
      font-size: 15px;
      line-height: 1.56;
      font-weight: 400;
      letter-spacing: 0;
      color: rgba(122, 122, 130, 0.82);
      font-family: var(--font-ui);
    }

    .guide .action::after {
      content: ">";
      display: inline-block;
      margin-left: 8px;
      letter-spacing: 0;
      color: rgba(122,122,130,0.44);
      text-shadow:
        7px 0 0 rgba(122,122,130,0.2),
        14px 0 0 rgba(122,122,130,0.08);
      animation: arrowDrift 1.85s ease-in-out infinite;
      transform-origin: left center;
      white-space: nowrap;
    }

    .wheel-ring {
      position: absolute;
      right: -122px;
      top: 236px;
      width: 372px;
      height: 372px;
      border-radius: 50%;
      border: 1px solid rgba(40, 40, 48, 0.06);
      opacity: 0;
      transform: scale(0.96);
      animation: wheelIn 820ms ease forwards 1540ms, goldBreath 5.8s ease-in-out infinite 2.4s;
      z-index: 1;
      pointer-events: none;
      filter: blur(1px);
    }

    .wheel-ring::before,
    .wheel-ring::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .wheel-ring::before {
      inset: 18px;
      border: 1px dashed rgba(40, 40, 48, 0.08);
    }

    .wheel-ring::after {
      inset: 52px;
      border: 1px solid rgba(40, 40, 48, 0.05);
      box-shadow: 0 0 34px rgba(191, 148, 63, 0.08), 0 0 72px rgba(191, 148, 63, 0.035);
      opacity: 0.46;
    }

    .wheel-stage {
      position: absolute;
      right: -116px;
      top: 228px;
      width: 380px;
      height: 380px;
      z-index: 4;
      opacity: 0;
      transform: translateX(18px) scale(0.96);
      animation: wheelIn 820ms cubic-bezier(.2,.86,.22,1) forwards 1700ms;
      transition: opacity 620ms ease, transform 620ms ease, filter 620ms ease;
      cursor: grab;
      touch-action: none;
    }

    .wheel-stage::before {
      content: "";
      position: absolute;
      inset: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(191,148,63,0.11) 0%, rgba(191,148,63,0.055) 22%, rgba(191,148,63,0.02) 42%, rgba(191,148,63,0) 70%);
      filter: blur(14px);
      opacity: 0.62;
      animation: goldBreath 5.8s ease-in-out infinite 2.6s;
      pointer-events: none;
      z-index: 0;
    }

    .wheel-stage.dragging { cursor: grabbing; }

    .wheel-stage.faded {
      opacity: 0.14;
      transform: translate(78px, -30px) scale(0.74);
      filter: blur(5px) saturate(0.7);
      pointer-events: none;
    }

    .wheel-ring.faded {
      opacity: 0.12;
      transform: translate(66px, -24px) scale(0.76);
      filter: blur(6px);
    }

    .wheel { position: absolute; inset: 0; z-index: 2; }

    .card-slot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 96px;
      margin-left: -28px;
      margin-top: -48px;
      transform-origin: center;
      pointer-events: auto;
    }

    .wheel-card {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
      border: 1px solid rgba(248,243,231,0.18);
      box-shadow: 0 12px 22px rgba(12,12,22,0.18);
      overflow: hidden;
      cursor: pointer;
      transition: transform 300ms ease, box-shadow 300ms ease, opacity 240ms ease, filter 300ms ease;
    }

    .wheel-card::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 10px;
      border: 1px solid rgba(248,243,231,0.14);
    }

    .wheel-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 24% 18%, rgba(255,255,255,0.07) 0 1px, transparent 1.2px),
        radial-gradient(circle at 70% 62%, rgba(255,255,255,0.05) 0 1px, transparent 1.2px),
        radial-gradient(circle at 50% 42%, rgba(255,255,255,0.04) 0 1px, transparent 1.2px);
      background-size: 22px 22px, 26px 26px, 32px 32px;
      opacity: 0.42;
    }

    .wheel-card .index {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(248,243,231,0.24);
      display: grid;
      place-items: center;
      font-size: 7px;
      color: rgba(248,243,231,0.72);
      z-index: 2;
      background: rgba(255,255,255,0.03);
    }

    .wheel-card .pattern {
      position: absolute;
      inset: 10px;
      border-radius: 10px;
      overflow: hidden;
    }

    .wheel-card .pattern::before,
    .wheel-card .pattern::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid rgba(248,243,231,0.72);
      border-radius: 999px;
    }

    .wheel-card .pattern::before {
      top: 4px;
      width: 28px;
      height: 76px;
    }

    .wheel-card .pattern::after {
      top: 16px;
      width: 40px;
      height: 40px;
    }

    .wheel-card .line.one,
    .wheel-card .line.two {
      position: absolute;
      left: 50%;
      top: 28px;
      width: 40px;
      height: 44px;
      margin-left: -20px;
      border-left: 2px solid rgba(248,243,231,0.9);
      border-radius: 40px;
      filter: drop-shadow(0 0 4px rgba(248,243,231,0.28));
      z-index: 2;
    }

    .wheel-card .line.one { transform: rotate(10deg); }
    .wheel-card .line.two { transform: rotate(-12deg); opacity: 0.9; }

    .wheel-card .stars {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      color: rgba(248,243,231,0.9);
      font-size: 10px;
      z-index: 2;
    }

    .wheel-card.picked {
      transform: translate(-6px, -26px) scale(1.08);
      box-shadow: 0 22px 42px rgba(18,18,30,0.32), 0 0 0 2px rgba(248,243,231,0.14);
      filter: brightness(1.08);
      z-index: 4;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(232, 231, 227, 0.46);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 420ms ease;
      z-index: 5;
    }

    .overlay.show { opacity: 1; }

    .selected-display {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 6px;
      height: 620px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(84px) scale(0.92);
      transform-origin: center center;
      z-index: 8;
      transition: opacity 220ms ease, transform 520ms cubic-bezier(.2,.86,.22,1);
      background: rgba(255,255,255,0.95);
      border-radius: 25px;
      box-shadow: 0 22px 56px rgba(20,20,28,0.08);
      border: 1px solid rgba(40,40,48,0.06);
      padding: 20px 20px 32px;
      display: grid;
      grid-template-columns: 168px 1fr;
      grid-template-rows: auto auto 1fr auto;
      column-gap: 22px;
      row-gap: 14px;
    }

    .selected-display.visible { opacity: 1; }
    .selected-display.settled { transform: translateY(0) scale(1); }

    .selected-card {
      position: relative;
      width: 168px;
      height: 276px;
      perspective: 1200px;
      filter: drop-shadow(0 16px 32px rgba(16,16,26,0.14));
      grid-column: 1;
      grid-row: 1 / span 2;
      justify-self: start;
      align-self: start;
    }

    .card-title-vertical {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: start;
      justify-self: end;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 18px;
      line-height: 1.92;
      letter-spacing: 0.12em;
      color: #2a2a30;
      font-family: var(--font-ui);
      font-weight: 400;
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding-right: 6px;
    }

    .card-share-button {
      grid-column: 2;
      grid-row: 2;
      justify-self: end;
      align-self: start;
      margin-top: -14px;
      margin-right: 0;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(39,39,44,0.06);
      background: rgba(255,255,255,0.95);
      box-shadow: 0 4px 12px rgba(20,20,28,0.05);
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      overflow: hidden;
    }

    .card-share-button:hover {
      box-shadow: 0 6px 14px rgba(20,20,28,0.08);
      filter: brightness(0.99);
    }

    .card-share-button:active {
      transform: scale(0.97);
    }

    .card-share-button img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
      opacity: 1;
      filter:
        drop-shadow(0.6px 0 0 rgba(39,39,44,0.92))
        drop-shadow(-0.6px 0 0 rgba(39,39,44,0.92))
        drop-shadow(0 0.6px 0 rgba(39,39,44,0.92))
        drop-shadow(0 -0.6px 0 rgba(39,39,44,0.92));
    }

    .card-title-vertical .dot { opacity: 0.46; }

    .outer-title-row,
    .outer-keyword,
    .card-english-name {
      display: none;
    }

    .result-sheet {
      grid-column: 1 / span 2;
      grid-row: 4;
      position: relative;
      left: auto;
      right: auto;
      bottom: auto;
      min-height: 228px;

      { name: '节制', chinese: '节制', en: 'Temperance', reading: '节制代表调和、节律与慢慢回到平衡。你现在最需要的不是逼自己振作，而是让情绪一点点恢复秩序。', svg: `<svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="320" fill="#d9e8ef"/><circle cx="110" cy="84" r="12" fill="#f0d5b2" stroke="#2d2620" stroke-width="2"/><path d="M98 98 h24 v78 h-24z" fill="#edf3f5" stroke="#2d2620" stroke-width="2"/><path d="M84 136 l-20 32 l24 -4 l18 -24z" fill="#f0d88d" stroke="#2d2620" stroke-width="2"/><path d="M136 136 l20 32 l-24 -4 l-18 -24z" fill="#f0d88d" stroke="#2d2620" stroke-width="2"/><rect x="0" y="282" width="220" height="38" fill="#f2efe7"/><text x="110" y="307" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2620">TEMPERANCE.</text></svg>` },
      { name: '女祭司', chinese: '女祭司', en: 'The High Priestess', reading: '女祭司象征直觉、沉静与尚未说出的答案。有些事不必马上想明白，先安静听听自己，答案会慢慢浮现。', svg: `<svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="320" fill="#d7dce6"/><circle cx="110" cy="88" r="12" fill="#f0d5b2" stroke="#2d2620" stroke-width="2"/><path d="M98 100 h24 v92 h-24z" fill="#eef1f5" stroke="#2d2620" stroke-width="2"/><path d="M64 72 h24 v140 h-24z" fill="#3d3f46" stroke="#2d2620" stroke-width="2"/><path d="M132 72 h24 v140 h-24z" fill="#f2d7d9" stroke="#2d2620" stroke-width="2"/><circle cx="110" cy="58" r="12" fill="none" stroke="#2d2620" stroke-width="2"/><rect x="0" y="282" width="220" height="38" fill="#f2efe7"/><text x="110" y="307" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2620">THE HIGH PRIESTESS.</text></svg>` },
      { name: '女皇', chinese: '女皇', en: 'The Empress', reading: '女皇代表滋养、接纳与被照顾的能力。你可以先把自己安放好，再去想下一步，不必总在匮乏里硬扛。', svg: `<svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="320" fill="#dbe4b7"/><circle cx="110" cy="94" r="12" fill="#f0d5b2" stroke="#2d2620" stroke-width="2"/><path d="M90 108 h40 v86 h-40z" fill="#f1e1cf" stroke="#2d2620" stroke-width="2"/><path d="M84 106 l26 -16 l26 16" fill="#d7b65f" stroke="#2d2620" stroke-width="2"/><path d="M64 210 C90 186 130 186 156 210" fill="#9fb75b" stroke="#2d2620" stroke-width="2"/><rect x="0" y="282" width="220" height="38" fill="#f2efe7"/><text x="110" y="307" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2620">THE EMPRESS.</text></svg>` },
      { name: '星币侍从', chinese: '星币侍从', en: 'Page of Pentacles', reading: '星币侍从强调学习、踏实与认真开始。先把眼前这一小步做好，很多结果都会在稳稳行动里长出来。', svg: `<svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="320" fill="#c7df9d"/><circle cx="110" cy="94" r="12" fill="#f0d5b2" stroke="#2d2620" stroke-width="2"/><path d="M98 108 h24 v84 h-24z" fill="#d88954" stroke="#2d2620" stroke-width="2"/><circle cx="110" cy="150" r="18" fill="#d8c06a" stroke="#2d2620" stroke-width="2"/><path d="M90 206 C102 194 118 194 130 206" fill="none" stroke="#2d2620" stroke-width="2"/><rect x="0" y="282" width="220" height="38" fill="#f2efe7"/><text x="110" y="307" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2620">PAGE OF PENTACLES.</text></svg>` },
      { name: '圣杯王后', chinese: '圣杯王后', en: 'Queen of Cups', reading: '圣杯王后代表感受力、共情与温柔承接。你不必把柔软藏起来，诚实面对情绪，反而会让你更有力量。', svg: `<svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="320" fill="#b9d9ea"/><circle cx="110" cy="90" r="12" fill="#f0d5b2" stroke="#2d2620" stroke-width="2"/><path d="M90 104 h40 v92 h-40z" fill="#eef3f7" stroke="#2d2620" stroke-width="2"/><path d="M80 154 h60 l-10 34 h-40z" fill="#b08c58" stroke="#2d2620" stroke-width="2"/><path d="M100 138 h20 l6 20 h-32z" fill="#f0e8d7" stroke="#2d2620" stroke-width="2"/><rect x="0" y="282" width="220" height="38" fill="#f2efe7"/><text x="110" y="307" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2620">QUEEN OF CUPS.</text></svg>` },
      { name: '圣杯五', chinese: '圣杯五', en: 'Five of Cups', reading: '圣杯五讲的是失落、遗憾与注意力停在失去之处。难过当然可以，但也别忘了，仍然有人和事还在接住你。', svg: `<svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="320" fill="#c2ccd5"/><path d="M82 188 h18 v24 h-18z" fill="#6b6f7b" stroke="#2d2620" stroke-width="2" transform="rotate(-22 91 200)"/><path d="M104 188 h18 v24 h-18z" fill="#6b6f7b" stroke="#2d2620" stroke-width="2" transform="rotate(8 113 200)"/><path d="M126 188 h18 v24 h-18z" fill="#6b6f7b" stroke="#2d2620" stroke-width="2" transform="rotate(20 135 200)"/><circle cx="110" cy="106" r="12" fill="#f0d5b2" stroke="#2d2620" stroke-width="2"/><path d="M98 118 h24 v76 h-24z" fill="#4d4f58" stroke="#2d2620" stroke-width="2"/><rect x="0" y="282" width="220" height="38" fill="#f2efe7"/><text x="110" y="307" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2d2620">FIVE OF CUPS.</text></svg>` }
    ];

    const wheel = document.getElementById('wheel');
    const wheelStage = document.getElementById('wheelStage');
    const wheelRing = document.getElementById('wheelRing');
    const guide = document.getElementById('guide');
    const topCopy = document.getElementById('topCopy');
    const overlay = document.getElementById('overlay');
    const selectedDisplay = document.getElementById('selectedDisplay');
    const selectedInner = document.getElementById('selectedInner');
    const cardTitleVertical = document.getElementById('cardTitleVertical');
    const resultSheet = document.getElementById('resultSheet');
    const resultTitle = document.getElementById('resultTitle');
    const resultText = document.getElementById('resultText');
    const frontArt = document.getElementById('frontArt');
    const frontLabel = document.getElementById('frontLabel');
    const resetButton = document.getElementById('resetButton');
    const nextVideoButton = document.getElementById('nextVideoButton');

    const TOTAL = 78;
    const STEP = 360 / TOTAL;
    const RADIUS = 164;
    const FOCUS_ANGLE = -102;
    let rotation = FOCUS_ANGLE - 38 * STEP;
    let dragging = false;
    let moved = false;
    let startAngle = 0;
    let startRotation = 0;
    let revealed = false;

    function signedAngle(angle) {
      return ((angle + 540) % 360) - 180;
    }

    function normalize(angle) {
      return ((angle % 360) + 360) % 360;
    }

    function getPointerAngle(event) {
      const rect = wheelStage.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(event.clientY - cy, event.clientX - cx) * 180 / Math.PI;
    }

    function getCardData(index) {
      const tarot = tarotFronts.find(card => card.name === '女祭司') || tarotFronts[0];
      return {
        id: index + 1,
        ...tarot
      };
    }

    function buildWheel() {
      for (let i = 0; i < TOTAL; i++) {
        const slot = document.createElement('div');
        slot.className = 'card-slot';
        slot.dataset.index = String(i);

        const card = document.createElement('button');
        card.className = 'wheel-card';
        card.type = 'button';
        card.setAttribute('aria-label', `选择第${i + 1}张牌`);
        card.innerHTML = `
          <div class="index">${i + 1}</div>
          <div class="pattern"></div>
          <div class="line one"></div>
          <div class="line two"></div>
          <div class="stars"><span>✦</span><span>✦</span></div>
        `;
        slot.appendChild(card);
        wheel.appendChild(slot);
      }
      updateWheel();
    }

    function updateWheel() {
      const slots = wheel.querySelectorAll('.card-slot');
      slots.forEach((slot, index) => {
        const base = index * STEP;
        const angle = normalize(base + rotation);
        const rad = angle * Math.PI / 180;
        const x = Math.cos(rad) * RADIUS;
        const y = Math.sin(rad) * RADIUS;
        const visible = x < 128;
        const tilt = Math.max(-56, Math.min(56, signedAngle(angle + 90)));
        slot.style.transform = `translate(${x}px, ${y}px) rotate(${tilt}deg)`;
        slot.style.zIndex = visible ? String(200 - Math.round(Math.abs(signedAngle(angle - FOCUS_ANGLE)))) : '0';
        slot.style.opacity = visible ? '1' : '0';
      });
    }

    function reveal(index) {
      if (revealed) return;
      revealed = true;
      const data = getCardData(index);
      const picked = wheel.querySelector(`.card-slot[data-index="${index}"] .wheel-card`);
      if (picked) picked.classList.add('picked');

      frontArt.innerHTML = data.svg;
      frontLabel.textContent = data.en.toUpperCase();
      cardTitleVertical.innerHTML = `<span>${data.name}</span><span class="dot">·</span><span>正位</span>`;
      resultTitle.textContent = `你抽到了「${data.chinese || data.name}」`;
      resultText.textContent = data.reading;

      setTimeout(() => {
        overlay.classList.add('show');
        topCopy.classList.add('faded');
        guide.classList.add('hidden');
        wheelStage.classList.add('faded');
        wheelRing.classList.add('faded');
        selectedDisplay.classList.add('visible');
        requestAnimationFrame(() => {
          selectedDisplay.classList.add('settled');
        });
      }, 1000);

      setTimeout(() => {
        selectedInner.classList.add('flipped');
      }, 1520);

      setTimeout(() => {
        resultSheet.classList.add('show');
      }, 1760);
    }

    function reset() {
      revealed = false;
      overlay.classList.remove('show');
      topCopy.classList.remove('faded');
      guide.classList.remove('hidden');
      wheelStage.classList.remove('faded');
      wheelRing.classList.remove('faded');
      resultSheet.classList.remove('show');
      selectedDisplay.classList.remove('visible', 'settled');
      selectedInner.classList.remove('flipped');
      wheel.querySelectorAll('.wheel-card.picked').forEach(el => el.classList.remove('picked'));
    }

    wheelStage.addEventListener('pointerdown', (event) => {
      if (revealed) return;
      dragging = true;
      moved = false;
      startAngle = getPointerAngle(event);
      startRotation = rotation;
      wheelStage.classList.add('dragging');
      wheelStage.setPointerCapture(event.pointerId);
    });

    wheelStage.addEventListener('pointermove', (event) => {
      if (!dragging || revealed) return;
      const delta = signedAngle(getPointerAngle(event) - startAngle);
      if (Math.abs(delta) > 1.2) moved = true;
      rotation = startRotation + delta;
      updateWheel();
    });

    wheelStage.addEventListener('pointerup', (event) => {
      if (!dragging || revealed) return;
      dragging = false;
      wheelStage.classList.remove('dragging');
      const hit = document.elementFromPoint(event.clientX, event.clientY)?.closest('.card-slot');
      if (!moved && hit) {
        reveal(Number(hit.dataset.index));
      }
      try { wheelStage.releasePointerCapture(event.pointerId); } catch (e) {}
    });

    wheelStage.addEventListener('pointercancel', () => {
      dragging = false;
      wheelStage.classList.remove('dragging');
    });

    nextVideoButton.addEventListener('click', () => {
      document.querySelector('.phone').classList.add('slide-next');
      setTimeout(() => {
        document.querySelector('.phone').classList.remove('slide-next');
        reset();
      }, 760);
    });

    resetButton.addEventListener('click', reset);

    buildWheel();
  </script>
</body>
</html>

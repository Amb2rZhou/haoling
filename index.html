<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
    />
    <title>douyin-hackathon</title>
  </head>
  <body>
    <div id="root"></div>
    <a href="/gallery" class="haoling-back" aria-label="返回好灵首页" title="返回好灵首页">
      <img src="/gallery/logo-haoling.png" alt="" />
    </a>
    <style>
      .haoling-back {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        right: calc(env(safe-area-inset-right, 0px) + 10px);
        width: 40px; height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 16px -4px rgba(0,0,0,0.25);
        display: flex; align-items: center; justify-content: center;
        z-index: 2147483647;
        overflow: hidden;
        border: 1px solid rgba(0,0,0,0.08);
        text-decoration: none;
        transition: transform 0.25s ease, background 0.25s ease;
      }
      .haoling-back:hover { transform: scale(1.06); background: #fff; }
      .haoling-back:active { transform: scale(0.94); }
      .haoling-back img {
        width: 28px; height: 28px;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
